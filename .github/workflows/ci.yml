name: allt

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install package
      run: pip install -e .

    - name: Install test dependencies
      run: pip install pytest

    - name: Train model
      run: python src/train.py

    - name: Run tests
      run: pytest

